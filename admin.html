<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Supabase Admin Panel — Vargas Web</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <style id="dynamicAccentStyle"></style>
    <style>
        .admin-wrapper { max-width: 520px; margin: 30px auto; padding: 0 16px 80px 16px; box-sizing: border-box; }
        .admin-box { background: #0b0e14; border: 1px solid var(--border); border-radius: 28px; padding: 24px 20px; box-shadow: 0 30px 60px rgba(0,0,0,0.85); display: flex; flex-direction: column; gap: 16px; }
        .admin-top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 4px; }
        .admin-title { font-size: 17px; font-weight: 800; color: #fff; }
        
        .admin-tabs { display: grid; grid-template-columns: repeat(2, 1fr); background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; padding: 4px; gap: 4px; }
        .tab-btn { background: none; border: none; color: var(--text-muted); padding: 10px 6px; font-size: 11px; font-weight: 700; border-radius: 8px; cursor: pointer; transition: all 0.2s; text-align: center; }
        .tab-btn.active { background: var(--primary); color: #050608; }

        .admin-panel-content { display: none; flex-direction: column; gap: 12px; }
        .admin-panel-content.active { display: flex; }

        .card-group { background: rgba(255, 255, 255, 0.015); border: 1px solid var(--border); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; position: relative; }
        .card-group-header { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 6px; }
        .remove-card-btn { background: rgba(255, 80, 80, 0.15); color: #ff5f56; border: none; width: 22px; height: 22px; border-radius: 50%; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .admin-actions-footer { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; border-top: 1px solid var(--border); padding-top: 16px; }
    </style>
</head>
<body>

    <div class="admin-wrapper">
        <div class="admin-box">
            
            <div class="admin-top-bar">
                <a href="index.html" style="font-size: 12px; color: var(--primary); text-decoration: none; font-weight: 700;">← Beranda</a>
                <div class="admin-title">⚙️ Supabase Admin</div>
                <a href="#" onclick="logoutAdmin()" style="font-size: 11px; color: #ff5f56; text-decoration: none; font-weight: 700;">Logout</a>
            </div>

            <!-- Form Login Supabase Auth -->
            <div id="loginSection" style="display: flex; flex-direction: column; gap: 14px; padding: 20px 0;">
                <div style="text-align: center; margin-bottom: 4px;">
                    <div style="font-size: 16px; font-weight: 800; margin-bottom: 4px;">Supabase Login</div>
                    <div style="font-size: 12px; color: var(--text-muted);">Gunakan akun email & password Supabase Anda.</div>
                </div>
                <div class="form-group">
                    <label>Email Admin:</label>
                    <input type="email" id="adminEmail" placeholder="admin@vargas.id" class="admin-input">
                </div>
                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" id="adminPassword" placeholder="••••••••" class="admin-input">
                </div>
                <button onclick="verifyLogin()" class="admin-btn">Login via Supabase</button>
            </div>

            <!-- Dashboard Pengaturan -->
            <div id="dashboardSection" style="display: none; flex-direction: column; gap: 14px;">
                
                <div class="admin-tabs">
                    <button class="tab-btn active" onclick="switchTab('profile')">👤 Profil & Teks</button>
                    <button class="tab-btn" onclick="switchTab('terminal')">💻 Terminal Info</button>
                    <button class="tab-btn" onclick="switchTab('tools')">🛠️ Hamburger Menu</button>
                    <button class="tab-btn" onclick="switchTab('socials')">🌐 Sosmed & Warna</button>
                </div>

                <!-- TAB 1: PROFIL & TEKS -->
                <div id="tab-profile" class="admin-panel-content active">
                    <div class="form-group"><label>Teks Logo Navbar:</label><input type="text" id="inputNavLogo" class="admin-input"></div>
                    <div class="form-group"><label>Banner Sambutan:</label><textarea id="inputWelcome" class="admin-input" rows="2"></textarea></div>
                    <div class="form-group"><label>URL Avatar:</label><input type="text" id="inputAvatar" class="admin-input"></div>
                    <div class="form-group"><label>Nama Lengkap:</label><input type="text" id="inputName" class="admin-input"></div>
                    <div class="form-group"><label>Role / Profesi:</label><input type="text" id="inputRole" class="admin-input"></div>
                    <div class="form-group"><label>Bio Singkat:</label><textarea id="inputBio" class="admin-input" rows="3"></textarea></div>
                    <div class="form-group"><label>Tech Skills:</label><input type="text" id="inputSkills" class="admin-input"></div>
                </div>

                <!-- TAB 2: TERMINAL INFO -->
                <div id="tab-terminal" class="admin-panel-content">
                    <div class="form-group"><label>Status:</label><input type="text" id="inputTermStatus" class="admin-input"></div>
                    <div class="form-group"><label>Lokasi:</label><input type="text" id="inputTermLoc" class="admin-input"></div>
                    <div class="form-group"><label>Fokus:</label><input type="text" id="inputTermFocus" class="admin-input"></div>
                    <div class="form-group"><label>Email:</label><input type="text" id="inputTermEmail" class="admin-input"></div>
                </div>

                <!-- TAB 3: HAMBURGER MENU -->
                <div id="tab-tools" class="admin-panel-content">
                    <div class="form-group"><label>Judul Hamburger Utama:</label><input type="text" id="inputHamburgerTitle" class="admin-input"></div>
                    <hr style="border: none; border-top: 1px solid var(--border); margin: 2px 0;">
                    <div id="projectsEditorContainer" style="display: flex; flex-direction: column; gap: 10px;"></div>
                    <button onclick="addProjectRow()" class="admin-btn-secondary">+ Tambah Item</button>
                </div>

                <!-- TAB 4: SOSIAL MEDIA & WARNA -->
                <div id="tab-socials" class="admin-panel-content">
                    <div class="form-group">
                        <label>Warna Utama (Accent Color):</label>
                        <select id="inputAccentColor" class="admin-input">
                            <option value="#00f5a0">Hijau Neon</option>
                            <option value="#3b82f6">Biru Modern</option>
                            <option value="#a855f7">Ungu Premium</option>
                            <option value="#f59e0b">Gold / Amber</option>
                            <option value="#ec4899">Pink Magenta</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Teks Footer:</label><input type="text" id="inputFooter" class="admin-input"></div>
                    <hr style="border: none; border-top: 1px solid var(--border); margin: 2px 0;">
                    <div id="socialsEditorContainer" style="display: flex; flex-direction: column; gap: 10px;"></div>
                    <button onclick="addSocialRow()" class="admin-btn-secondary">+ Tambah Sosmed</button>
                </div>

                <div class="admin-actions-footer">
                    <button onclick="saveAllSettingsToSupabase()" class="admin-btn">💾 Simpan ke Supabase</button>
                </div>
            </div>

        </div>
    </div>

    <!-- Supabase SDK CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
    <script>
        window.onload = async function() {
            const session = await checkSupabaseSession();
            if (session) {
                showDashboard();
            }
        };

        async function verifyLogin() {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                alert('Login Gagal: ' + error.message);
            } else {
                alert('Login Berhasil!');
                showDashboard();
            }
        }

        async function checkSupabaseSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            return session;
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.admin-panel-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'profile') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-profile').classList.add('active');
            } else if (tabName === 'terminal') {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-terminal').classList.add('active');
            } else if (tabName === 'tools') {
                document.querySelectorAll('.tab-btn')[2].classList.add('active');
                document.getElementById('tab-tools').classList.add('active');
            } else if (tabName === 'socials') {
                document.querySelectorAll('.tab-btn')[3].classList.add('active');
                document.getElementById('tab-socials').classList.add('active');
            }
        }

        async function showDashboard() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('dashboardSection').style.display = 'flex';

            let data = await fetchMasterDataFromSupabase();
            if (!data) data = DEFAULT_DATA;
            
            document.getElementById('inputNavLogo').value = data.profile?.navLogo || 'Vargas';
            document.getElementById('inputWelcome').value = data.profile?.welcomeText || '';
            document.getElementById('inputName').value = data.profile?.name || '';
            document.getElementById('inputRole').value = data.profile?.role || '';
            document.getElementById('inputBio').value = data.profile?.bio || '';
            document.getElementById('inputAvatar').value = data.profile?.avatar || '';
            document.getElementById('inputSkills').value = data.profile?.skills || '';
            document.getElementById('inputAccentColor').value = data.profile?.accentColor || '#00f5a0';
            document.getElementById('inputHamburgerTitle').value = data.profile?.hamburgerTitle || '🛠️ My Tools & Projects';
            document.getElementById('inputFooter').value = data.profile?.footerText || '';

            document.getElementById('inputTermStatus').value = data.terminal?.status || '';
            document.getElementById('inputTermLoc').value = data.terminal?.location || '';
            document.getElementById('inputTermFocus').value = data.terminal?.focus || '';
            document.getElementById('inputTermEmail').value = data.terminal?.email || '';

            renderProjectsEditor(data.projects || DEFAULT_DATA.projects);
            renderSocialsEditor(data.socials || DEFAULT_DATA.socials);
        }

        function renderProjectsEditor(projects) {
            const container = document.getElementById('projectsEditorContainer');
            if(!container) return;
            container.innerHTML = '';
            projects.forEach((proj, idx) => {
                const isText = proj.type === 'text';
                container.innerHTML += `
                    <div class="card-group">
                        <div class="card-group-header">
                            <span>Item Menu #${idx + 1}</span>
                            <button type="button" class="remove-card-btn" onclick="this.closest('.card-group').remove()">×</button>
                        </div>
                        <div class="form-group">
                            <label>Tipe Item:</label>
                            <select class="admin-input p-type" onchange="toggleUrlInput(this)">
                                <option value="tool" ${!isText?'selected':''}>Tool / Link Website</option>
                                <option value="text" ${isText?'selected':''}>Teks / About Me</option>
                            </select>
                        </div>
                        <div class="form-group"><label>Judul:</label><input type="text" class="admin-input p-title" value="${proj.title || ''}"></div>
                        <div class="form-group"><label>Deskripsi:</label><input type="text" class="admin-input p-desc" value="${proj.desc || ''}"></div>
                        <div class="form-group url-group" style="display: ${isText?'none':'block'};">
                            <label>URL Link:</label><input type="text" class="admin-input p-url" value="${proj.url || ''}">
                        </div>
                    </div>
                `;
            });
        }

        function toggleUrlInput(selectElem) {
            const group = selectElem.closest('.card-group');
            const urlGroup = group.querySelector('.url-group');
            if (selectElem.value === 'text') {
                urlGroup.style.display = 'none';
            } else {
                urlGroup.style.display = 'block';
            }
        }

        function renderSocialsEditor(socials) {
            const container = document.getElementById('socialsEditorContainer');
            if(!container) return;
            container.innerHTML = '';
            socials.forEach((soc, idx) => {
                container.innerHTML += `
                    <div class="card-group">
                        <div class="card-group-header">
                            <span>Sosmed #${idx + 1}</span>
                            <button type="button" class="remove-card-btn" onclick="this.closest('.card-group').remove()">×</button>
                        </div>
                        <div class="form-group">
                            <label>Platform:</label>
                            <select class="admin-input s-type">
                                <option value="instagram" ${soc.type==='instagram'?'selected':''}>Instagram</option>
                                <option value="tiktok" ${soc.type==='tiktok'?'selected':''}>TikTok</option>
                                <option value="facebook" ${soc.type==='facebook'?'selected':''}>Facebook</option>
                                <option value="whatsapp" ${soc.type==='whatsapp'?'selected':''}>WhatsApp</option>
                                <option value="youtube" ${soc.type==='youtube'?'selected':''}>YouTube</option>
                                <option value="github" ${soc.type==='github'?'selected':''}>GitHub</option>
                                <option value="telegram" ${soc.type==='telegram'?'selected':''}>Telegram</option>
                                <option value="donate" ${soc.type==='donate'?'selected':''}>Donasi / Saweria</option>
                            </select>
                        </div>
                        <div class="form-group"><label>Label:</label><input type="text" class="admin-input s-name" value="${soc.name || ''}"></div>
                        <div class="form-group"><label>URL:</label><input type="text" class="admin-input s-url" value="${soc.url || ''}"></div>
                    </div>
                `;
            });
        }

        function addProjectRow() {
            const container = document.getElementById('projectsEditorContainer');
            if(!container) return;
            container.insertAdjacentHTML('beforeend', `
                <div class="card-group">
                    <div class="card-group-header">
                        <span>Item Baru</span>
                        <button type="button" class="remove-card-btn" onclick="this.closest('.card-group').remove()">×</button>
                    </div>
                    <div class="form-group">
                        <label>Tipe Item:</label>
                        <select class="admin-input p-type" onchange="toggleUrlInput(this)">
                            <option value="tool">Tool / Link Website</option>
                            <option value="text">Teks / About Me</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Judul:</label><input type="text" class="admin-input p-title" value=""></div>
                    <div class="form-group"><label>Deskripsi:</label><input type="text" class="admin-input p-desc" value=""></div>
                    <div class="form-group url-group"><label>URL Link:</label><input type="text" class="admin-input p-url" value=""></div>
                </div>
            `);
        }

        function addSocialRow() {
            const container = document.getElementById('socialsEditorContainer');
            if(!container) return;
            container.insertAdjacentHTML('beforeend', `
                <div class="card-group">
                    <div class="card-group-header">
                        <span>Sosmed Baru</span>
                        <button type="button" class="remove-card-btn" onclick="this.closest('.card-group').remove()">×</button>
                    </div>
                    <div class="form-group">
                        <label>Platform:</label>
                        <select class="admin-input s-type">
                            <option value="instagram">Instagram</option>
                            <option value="tiktok">TikTok</option>
                            <option value="facebook">Facebook</option>
                            <option value="whatsapp">WhatsApp</option>
                            <option value="youtube">YouTube</option>
                            <option value="github">GitHub</option>
                            <option value="telegram">Telegram</option>
                            <option value="donate">Donasi / Saweria</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Label:</label><input type="text" class="admin-input s-name" value=""></div>
                    <div class="form-group"><label>URL:</label><input type="text" class="admin-input s-url" value=""></div>
                </div>
            `);
        }

        async function saveAllSettingsToSupabase() {
            const profile = {
                navLogo: document.getElementById('inputNavLogo').value,
                welcomeText: document.getElementById('inputWelcome').value,
                name: document.getElementById('inputName').value,
                role: document.getElementById('inputRole').value,
                bio: document.getElementById('inputBio').value,
                avatar: document.getElementById('inputAvatar').value,
                skills: document.getElementById('inputSkills').value,
                accentColor: document.getElementById('inputAccentColor').value,
                hamburgerTitle: document.getElementById('inputHamburgerTitle').value,
                footerText: document.getElementById('inputFooter').value
            };

            const terminal = {
                status: document.getElementById('inputTermStatus').value,
                location: document.getElementById('inputTermLoc').value,
                focus: document.getElementById('inputTermFocus').value,
                email: document.getElementById('inputTermEmail').value
            };

            const projects = [];
            document.querySelectorAll('#projectsEditorContainer .card-group').forEach(row => {
                const type = row.querySelector('.p-type').value;
                projects.push({
                    type: type,
                    title: row.querySelector('.p-title').value,
                    desc: row.querySelector('.p-desc').value,
                    url: type === 'text' ? '' : row.querySelector('.p-url').value
                });
            });

            const socials = [];
            document.querySelectorAll('#socialsEditorContainer .card-group').forEach(row => {
                const type = row.querySelector('.s-type').value;
                socials.push({
                    type: type,
                    name: row.querySelector('.s-name').value,
                    url: row.querySelector('.s-url').value,
                    donate: type === 'donate'
                });
            });

            const masterData = { profile, terminal, projects, socials };
            await saveMasterDataToSupabase(masterData);
        }

        async function logoutAdmin() {
            await supabaseClient.auth.signOut();
            sessionStorage.clear();
            window.location.reload();
        }
    </script>
</body>
</html>
